name: Check In

# ✅ 签到续期：运行此 workflow 可重置 7 天计时，保持 "Get Hot News" 正常运行
# ✅ Renewal: Run this workflow to reset the 7-day timer and keep "Get Hot News" active
#
# 📌 操作方法 / How to use:
#   1. 点击 "Run workflow" 按钮 / Click "Run workflow" button
#   2. 每 7 天内至少运行一次 / Run at least once every 7 days
#
# 🤖 本仓库已改为自动签到 / Auto check-in in this repo:
#    schedule 每 3 天自动运行一次（北京时间周一/周四 09:00），
#    无需再手动点击；workflow_dispatch 保留用于手动补跑。
#    依据：该 workflow 本身只删除运行记录以重置计时，不校验触发方式，
#    定时触发与手动触发效果完全相同。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1,4"

jobs:
  del_runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Delete all workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
          delete_workflow_by_state_pattern: "ALL"
          delete_run_by_conclusion_pattern: "ALL"